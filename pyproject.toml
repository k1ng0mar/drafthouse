[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drafthouse"
version = "0.1.0"
description = "Claude Design–class verify loop + design MCP for Hermes Agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Drafthouse contributors" }]
keywords = ["hermes", "agent", "design", "claude-design", "mcp", "lint"]
dependencies = []

[project.optional-dependencies]
mcp = []

[project.scripts]
drafthouse = "drafthouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drafthouse = ["py.typed"]
