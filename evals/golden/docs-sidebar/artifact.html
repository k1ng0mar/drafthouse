<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Verify loop · Drafthouse docs</title>
    <style>
      :root {
        --dd-ink: #0c0a09;
        --dd-ink-2: #44403c;
        --dd-page: #ffffff;
        --dd-panel: #fafaf9;
        --dd-border: #e7e5e4;
        --dd-link: #0f766e;
        --dd-code-bg: #f5f5f4;
        --dd-font-body: system-ui, "Segoe UI", sans-serif;
        --dd-font-mono: "JetBrains Mono", Consolas, monospace;
      }
      body { margin: 0; font-family: var(--dd-font-body); color: var(--dd-ink); background: var(--dd-page); }
      .shell { display: grid; min-height: 100vh; }
      @media (min-width: 800px) { .shell { grid-template-columns: 220px 1fr; } }
      aside {
        background: var(--dd-panel);
        border-right: 1px solid var(--dd-border);
        padding: 1.25rem 1rem;
      }
      aside a {
        display: block;
        color: var(--dd-ink-2);
        text-decoration: none;
        padding: 0.35rem 0;
        font-size: 0.95rem;
      }
      aside a.active { color: var(--dd-link); font-weight: 600; }
      main { padding: 2rem 1.5rem 3rem; max-width: 42rem; }
      h1 { margin: 0 0 0.75rem; font-weight: 650; letter-spacing: -0.02em; }
      code {
        font-family: var(--dd-font-mono);
        font-size: 0.88em;
        background: var(--dd-code-bg);
        border: 1px solid var(--dd-border);
        padding: 0.1em 0.35em;
        border-radius: 3px;
      }
      p { line-height: 1.65; color: var(--dd-ink-2); }
      a { color: var(--dd-link); }
      a:focus-visible { outline: 2px solid var(--dd-link); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside aria-label="Docs">
        <a href="#">Overview</a>
        <a class="active" href="#">Verify loop</a>
        <a href="#">Lint rules</a>
        <a href="#">Design systems</a>
      </aside>
      <main>
        <h1>Verify loop</h1>
        <p>
          Bind tokens, look up pattern structure, run P0 checklist, score 5-dim, lint, then
          optional vision. Use <code>bash bin/drafthouse lint artifact.html</code> before handoff.
        </p>
        <p>Ship rule: lint P0 empty and token check pass.</p>
      </main>
    </div>
  </body>
</html>
