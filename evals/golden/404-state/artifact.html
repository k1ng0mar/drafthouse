<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>404 · Drafthouse Field Manual</title>
    <style>
      :root {
        --dt-ink: #12160f;
        --dt-ink-2: #1e241d;
        --dt-paper: #ecebe2;
        --dt-rust: #e65b35;
        --dt-rule: #c5c9b8;
        --dt-font-display: Georgia, "Times New Roman", serif;
        --dt-font-body: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: var(--dt-font-body);
        background: var(--dt-paper);
        color: var(--dt-ink-2);
      }
      main { max-width: 28rem; padding: 2rem; text-align: left; }
      .code {
        font-family: var(--dt-font-display);
        font-size: 3rem;
        color: var(--dt-rust);
        margin: 0;
        letter-spacing: -0.04em;
      }
      h1 {
        font-family: var(--dt-font-display);
        color: var(--dt-ink);
        font-size: 1.5rem;
        margin: 0.5rem 0 1rem;
      }
      a {
        color: var(--dt-rust);
        font-weight: 600;
      }
      a:focus-visible { outline: 2px solid #c4df6b; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Plate not in this fieldbook.</h1>
      <p>The page you requested is not filed under this manual.</p>
      <p><a class="cta" href="/">Back to the ledger</a></p>
    </main>
  </body>
</html>
